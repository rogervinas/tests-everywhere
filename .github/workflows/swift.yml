name: Swift

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/swift.yml
      - swift/**
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/swift.yml
      - swift/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: swift

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # We can use swift-actions/setup-swift@v1 but this is faster
      - name: Configure Swift
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Xcode $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Test
        run: swift test

      - name: Build
        run: swift build
