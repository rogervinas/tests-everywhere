name: Ruby

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/ruby.yml
      - ruby/**
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/ruby.yml
      - ruby/**

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ruby

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3'
          bundler-cache: true
          working-directory: ruby

      - name: Test
        run: bundle exec rspec -fd
